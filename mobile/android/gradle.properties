# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE UI will override any settings in this file.

# Specifying JVM arguments used for the daemon process.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Use AndroidX
android.useAndroidX=true

# Enable Hermes engine
hermesEnabled=true

# Enable New Architecture (Fabric & TurboModules)
newArchEnabled=false

# Suppress compileSdk 35 warning for AGP 8.2.1
android.suppressUnsupportedCompileSdk=35
